<!doctype html>
<html lang="en" data-theme="saas">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Event Ops Planner — Run-of-Show, Staff, Vendors &amp; Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root, html[data-theme="saas"]{
  --bg:#F6F7F9; --bg2:#EEF0F4; --surface:#FFFFFF; --surface2:#F1F3F7;
  --ink:#14161C; --muted:#5C6472; --faint:#8A93A3;
  --line:#E2E5EC; --line-strong:#CBD1DD;
  --accent:#4F46E5; --accent-soft:#EEEDFB; --accent-ink:#FFFFFF;
  --good:#15803D; --good-soft:#E7F6EC; --warn:#B45309; --warn-soft:#FDF1DE;
  --bad:#B91C1C; --bad-soft:#FDECEC;
  --radius:12px; --radius-sm:8px; --bw:1px;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 8px 24px rgba(20,22,28,.05);
  --shadow-pop:0 12px 40px rgba(20,22,28,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:var(--font); --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --hero-bg:#14161C; --hero-ink:#FFFFFF; --hero-muted:#B9BFCB;
  color-scheme:light;
}
html[data-theme="bold"]{
  --bg:#FFF6E9; --bg2:#FFE9C7; --surface:#FFFFFF; --surface2:#FFF1D6;
  --ink:#1D1A12; --muted:#5F5744; --faint:#8B8168;
  --line:#1D1A12; --line-strong:#1D1A12;
  --accent:#FF5C38; --accent-soft:#FFE3DA; --accent-ink:#FFFFFF;
  --good:#0E7A3D; --good-soft:#D9F5E3; --warn:#9A6200; --warn-soft:#FFEFC2;
  --bad:#C2261B; --bad-soft:#FFDCD6;
  --radius:20px; --radius-sm:14px; --bw:2px;
  --shadow:5px 5px 0 #1D1A12; --shadow-pop:8px 8px 0 #1D1A12;
  --font:"Archivo",-apple-system,"Segoe UI",sans-serif;
  --font-display:"Archivo",sans-serif; --font-mono:"JetBrains Mono",monospace;
  --hero-bg:#FFC531; --hero-ink:#1D1A12; --hero-muted:#5A4A12;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0A0C10; --bg2:#0E1117; --surface:#14181F; --surface2:#1A1F29;
  --ink:#EDF1F7; --muted:#9AA6B8; --faint:#66707F;
  --line:#262D3A; --line-strong:#39424F;
  --accent:#B8F135; --accent-soft:#243112; --accent-ink:#131702;
  --good:#4ADE80; --good-soft:#12291B; --warn:#FBBF24; --warn-soft:#2E2410;
  --bad:#F87171; --bad-soft:#331618;
  --radius:14px; --radius-sm:10px; --bw:1px;
  --shadow:0 0 0 1px rgba(184,241,53,.04),0 16px 40px rgba(0,0,0,.5);
  --shadow-pop:0 20px 60px rgba(0,0,0,.7);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:var(--font); --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --hero-bg:#10141B; --hero-ink:#EDF1F7; --hero-muted:#9AA6B8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;transition:background .25s ease,color .25s ease}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px 64px}

/* ============ TOP BAR / THEME TOGGLE ============ */
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:var(--bw) solid var(--line);backdrop-filter:saturate(1.2)}
.topbar-in{max-width:1060px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand-dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;flex:none;border:var(--bw) solid var(--line-strong)}
html[data-theme="bold"] .brand-dot{border-radius:50%;box-shadow:3px 3px 0 #1D1A12}
.theme-switch{display:flex;background:var(--surface);border:var(--bw) solid var(--line-strong);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.theme-switch button{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:700;white-space:nowrap}
.theme-switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.theme-switch .ts-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);align-self:center;padding:0 4px 0 8px}

/* ============ HERO / SUMMARY ============ */
.hero{margin-top:22px;background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--radius);border:var(--bw) solid var(--line-strong);box-shadow:var(--shadow);padding:26px 26px 22px;position:relative;overflow:hidden}
html[data-theme="dark"] .hero{box-shadow:0 0 0 1px rgba(184,241,53,.12),0 18px 48px rgba(0,0,0,.55)}
.tagline{font-size:15px;color:var(--hero-muted);margin:0 0 14px;max-width:56ch}
.hero h1{font-family:var(--font-display);font-size:clamp(26px,4.6vw,40px);line-height:1.08;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
html[data-theme="bold"] .hero h1{font-weight:900;text-transform:none}
.hero .client{font-size:16px;color:var(--hero-muted);margin:0}
.demo-tag{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:18px;font-family:var(--font-mono);font-size:14px}
.hero-meta b{display:block;font-family:var(--font);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted);font-weight:700;margin-bottom:2px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* ============ BUTTONS / CHIPS ============ */
.btn{border:var(--bw) solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:14.5px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 11px;font-size:13.5px}
.btn:active{transform:translateY(1px)}
.hero .btn{background:transparent;color:var(--hero-ink);border-color:var(--hero-muted);box-shadow:none}
.hero .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* event switcher */
.switcher{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 4px}
.switcher .sw-label{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.ev-chip{border:var(--bw) solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;box-shadow:var(--shadow);color:var(--ink)}
.ev-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ============ STAT STRIP ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat .num{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:6px}
.ring-wrap{display:flex;align-items:center;gap:12px}
.ring{flex:none;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface2)}
.ring .fill{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.ring-num{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}

/* ============ TABS ============ */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 18px}
.tabs button{border:var(--bw) solid var(--line-strong);background:var(--surface);color:var(--muted);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
html[data-theme="dark"] .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.panel h2{font-family:var(--font-display);font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.panel-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.empty{border:2px dashed var(--line-strong);border-radius:var(--radius-sm);padding:26px;text-align:center;color:var(--muted)}

/* timeline */
.cue{display:grid;grid-template-columns:86px 22px 1fr;gap:0 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.cue:last-of-type{border-bottom:0}
.cue-time{font-family:var(--font-mono);font-weight:700;font-size:14.5px;padding-top:2px;white-space:nowrap}
.cue-rail{position:relative}
.cue-rail::before{content:"";position:absolute;left:50%;top:26px;bottom:-16px;width:2px;background:var(--line);transform:translateX(-50%)}
.cue:last-of-type .cue-rail::before{display:none}
.cue-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin:5px auto 0;position:relative;z-index:1;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}
.cue-body h3{margin:0;font-size:16.5px}
.cue-body p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-top:7px}
html[data-theme="dark"] .pill{color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.plain{background:var(--surface2);color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.icon-btn:hover{color:var(--ink)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}

/* rows (staff / vendors / issues) */
.list-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.list-row:last-of-type{border-bottom:0}
.list-row .who{min-width:200px;flex:1}
.list-row .who b{font-size:16px}
.list-row .who span{display:block;color:var(--muted);font-size:14px}
.meta-mono{font-family:var(--font-mono);font-size:14px;font-weight:700;white-space:nowrap}
.check-btn{border:var(--bw) solid var(--line-strong);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13.5px;background:var(--surface2);color:var(--muted)}
.check-btn.on{background:var(--good-soft);color:var(--good);border-color:var(--good)}

/* prep */
.prep-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.prep-item:last-of-type{border-bottom:0}
.prep-box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-weight:900;color:transparent;margin-top:1px;padding:0}
.prep-box.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prep-item .lbl{flex:1;font-size:15.5px}
.prep-item.done .lbl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}

/* case study */
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 30px}
.cs-grid h3{font-family:var(--font-display);font-size:16px;margin:0 0 6px}
.cs-grid p,.cs-grid li{color:var(--muted);font-size:15px}
.cs-grid p{margin:0}.cs-grid ul{margin:0;padding-left:19px}.cs-grid li{margin:4px 0}
.cs-full{grid-column:1/-1}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kv span{font-family:var(--font-mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--ink)}

/* footer */
.foot{margin-top:34px;color:var(--faint);font-size:13.5px;text-align:center}
.foot b{color:var(--muted)}

/* ============ MODAL ============ */
dialog{border:var(--bw) solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow-pop);padding:0;width:min(520px,calc(100vw - 28px));max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(8,10,14,.55)}
.modal-in{padding:24px}
.modal-in h2{font-family:var(--font-display);margin:0 0 4px;font-size:21px}
.modal-in .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:var(--bw) solid var(--line-strong);background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow-pop);transition:transform .3s ease;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .cs-grid{grid-template-columns:1fr}
  .panel{padding:17px}
  .hero{padding:21px 18px 18px}
  .cue{grid-template-columns:70px 18px 1fr;gap:0 9px}
  .cue-time{font-size:13px}
  .field-row{grid-template-columns:1fr}
  .topbar-in{padding:10px 14px}
  .theme-switch button{padding:7px 10px;font-size:12.5px}
  .theme-switch .ts-label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-dot" aria-hidden="true">◷</span> Event Ops Planner</div>
    <div class="theme-switch" role="group" aria-label="Design theme">
      <span class="ts-label">Vibe</span>
      <button type="button" data-theme-btn="saas" aria-pressed="true">Clean SaaS</button>
      <button type="button" data-theme-btn="bold" aria-pressed="false">Bold Consumer</button>
      <button type="button" data-theme-btn="dark" aria-pressed="false">Dark Premium</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- Event switcher -->
  <nav class="switcher" aria-label="Your events">
    <span class="sw-label">Events</span>
    <span id="eventChips" style="display:contents"></span>
    <button class="btn small primary" type="button" id="newEventBtn">＋ New event</button>
  </nav>

  <!-- Summary header -->
  <section class="hero" id="hero" aria-live="polite"></section>

  <!-- Stats -->
  <section class="stats" id="stats" aria-label="Event readiness summary"></section>

  <!-- Tabs -->
  <div class="tabs" role="tablist" aria-label="Event workspace">
    <button role="tab" data-tab="cues" aria-selected="true">Run of Show</button>
    <button role="tab" data-tab="staff" aria-selected="false">Staff</button>
    <button role="tab" data-tab="vendors" aria-selected="false">Vendors</button>
    <button role="tab" data-tab="prep" aria-selected="false">Prep Checklist</button>
    <button role="tab" data-tab="issues" aria-selected="false">Day-of Issues <span id="issueBadge"></span></button>
    <button role="tab" data-tab="casestudy" aria-selected="false">Case Study</button>
  </div>

  <main id="panelHost"></main>

  <p class="foot">Demo event is fictional, created for this portfolio demo. <b>Your edits save in this browser only</b> — nothing leaves your device, and clearing site data resets the demo.</p>
</div>

<!-- Modal -->
<dialog id="modal"><div class="modal-in" id="modalIn"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ================= THEME ================= */
var THEME_KEY = "eventops-theme";
function applyTheme(name){
  if(["saas","bold","dark"].indexOf(name)===-1) name="saas";
  document.documentElement.setAttribute("data-theme", name);
  try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
  var btns=document.querySelectorAll("[data-theme-btn]");
  for(var i=0;i<btns.length;i++){ btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-theme-btn")===name ? "true":"false"); }
}
(function initTheme(){
  var saved="saas"; try{ saved=localStorage.getItem(THEME_KEY)||"saas"; }catch(e){}
  applyTheme(saved);
})();
document.querySelectorAll("[data-theme-btn]").forEach(function(b){
  b.addEventListener("click", function(){ applyTheme(b.getAttribute("data-theme-btn")); toast("Theme: "+b.textContent.trim()); });
});
document.addEventListener("keydown", function(e){
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="1") applyTheme("saas");
  if(e.key==="2") applyTheme("bold");
  if(e.key==="3") applyTheme("dark");
});

/* ================= DATA ================= */
var STORE_KEY = "eventops-planner-v1";
var uidCounter = 1000;
function uid(p){ return p + "-" + (++uidCounter) + "-" + Math.random().toString(36).slice(2,7); }

function demoEvent(){
  return {
    id:"ev-northwind", name:"Holiday Buyout", client:"Northwind Labs", fictional:true,
    dateLabel:"Fri, Dec 11, 2026", doors:"5:30 PM", guests:240, venue:"Main Hall + Bays 1–12",
    cues:[
      {id:uid("cue"), time:"5:30 PM", title:"Doors open — check-in & coat check live", owner:"Sam · Check-in", notes:"Wristbands by group color. Client welcome sign on the entry screen."},
      {id:uid("cue"), time:"6:00 PM", title:"Welcome remarks from Northwind host", owner:"Maya · Event Lead", notes:"Mic 1 on stage left. House music dips at 5:58."},
      {id:uid("cue"), time:"6:20 PM", title:"Food stations open", owner:"Bay Bites Catering", notes:"Three stations: sliders, tacos, dessert. Allergen cards at each station."},
      {id:uid("cue"), time:"6:45 PM", title:"Tournament bracket kicks off", owner:"Jordan · Floor Lead", notes:"16 teams across Bays 1–12. Bracket on the big screen, scores to Jordan."},
      {id:uid("cue"), time:"7:30 PM", title:"Photo booth + dessert push", owner:"Taylor · AV / Photo Booth", notes:"Announce booth location. Watch printer paper — see open issue."},
      {id:uid("cue"), time:"8:15 PM", title:"Awards & raffle", owner:"Maya · Event Lead", notes:"Trophies from back office. Raffle drum to stage at 8:05."},
      {id:uid("cue"), time:"9:00 PM", title:"Last food call, bar winds down", owner:"Alex · Bar Lead", notes:"Announce last call for stations; bar last call at 9:30."},
      {id:uid("cue"), time:"10:00 PM", title:"Event close — thank-yous & load-out", owner:"Full team", notes:"Client walkthrough, lost & found sweep, vendor load-out via bay door."}
    ],
    staff:[
      {id:uid("st"), name:"Maya Chen", role:"Event Lead", call:"3:30 PM", confirmed:true},
      {id:uid("st"), name:"Jordan Lee", role:"Floor Lead", call:"4:00 PM", confirmed:true},
      {id:uid("st"), name:"Alex Rivera", role:"Bar Lead", call:"4:00 PM", confirmed:true},
      {id:uid("st"), name:"Sam Patel", role:"Check-in & Welcome", call:"4:30 PM", confirmed:true},
      {id:uid("st"), name:"Taylor Brooks", role:"AV / Photo Booth", call:"4:30 PM", confirmed:true},
      {id:uid("st"), name:"Casey Morgan", role:"Floor Runner", call:"5:00 PM", confirmed:false}
    ],
    vendors:[
      {id:uid("vn"), name:"Bay Bites Catering", service:"Food stations ×3", arrival:"3:00 PM", contact:"Priya — (555) 014-2280", status:"Confirmed"},
      {id:uid("vn"), name:"Soundline AV", service:"DJ, lighting & stage mic", arrival:"2:30 PM", contact:"Devon — (555) 014-7731", status:"Set & soundchecked"},
      {id:uid("vn"), name:"Golden Hour Photo Co.", service:"Photo booth + prints", arrival:"4:00 PM", contact:"Ruth — (555) 014-9054", status:"On site"}
    ],
    prep:[
      {id:uid("pp"), label:"BEO signed and filed", done:true},

var state = { events:[], activeId:null, tab:"cues" };
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({events:state.events, activeId:state.activeId})); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var parsed = JSON.parse(raw); if(parsed && parsed.events && parsed.events.length){ state.events=parsed.events; state.activeId=parsed.activeId||parsed.events[0].id; return; } }
  }catch(e){}
  var d = demoEvent(); state.events=[d]; state.activeId=d.id; save();
}
function activeEvent(){ for(var i=0;i<state.events.length;i++){ if(state.events[i].id===state.activeId) return state.events[i]; } return state.events[0]; }

/* ================= HELPERS ================= */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function plain(s){ return String(s==null?"":s); } // stored values are raw text; rendering always goes through esc()
function prepPct(ev){ if(!ev.prep.length) return 0; var d=ev.prep.filter(function(p){return p.done;}).length; return Math.round(d/ev.prep.length*100); }
function openIssues(ev){ return ev.issues.filter(function(i){return i.status==="Open";}).length; }
function confirmedStaff(ev){ return ev.staff.filter(function(s){return s.confirmed;}).length; }
var toastTimer=null;
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },2400); }

function renderCaseStudy(){

    '<div><h3>The problem</h3><p>Event day runs on paper BEOs, group chats, and memory. The run-of-show lives in one document, staff confirmations in texts, vendor arrivals in email — so on the night, the event lead becomes the integration layer, answering “what happens next?” and “has the DJ arrived?” for six hours straight.</p></div>' +
    '<div><h3>Who it\'s for</h3><p>Event leads and floor managers running corporate buyouts, holiday parties, and venue events with 50–500 guests, a small staff, and two to five outside vendors.</p><div class="kv"><span>Event lead</span><span>Floor staff</span><span>Vendors</span><span>Client host</span></div></div>' +
    '<div><h3>MVP scope (this demo)</h3><ul><li>One workspace per event: summary, cues, staff, vendors, prep, issues</li><li>Readiness % computed live from the prep checklist</li><li>Staff confirmation toggles — unconfirmed names stay visible</li><li>Issue log with owner + severity, resolvable in one tap</li><li>Runs entirely in the browser; no account, no server</li></ul></div>' +
    '<div><h3>What I deliberately cut</h3><ul><li>Multi-user live sync — a v2 problem; paper fails first on visibility, not collaboration</li><li>Payments &amp; contracts — the BEO stays the source of truth</li><li>Guest-list management — registration tools already do it well</li></ul></div>' +
    '<div><h3>How I\'d measure it</h3><ul><li>Unconfirmed staff at doors-open: target zero</li><li>Open issues carried past event close</li><li>Time from “issue spotted” to “issue owned”</li><li>Prep readiness at T-24h vs. at doors</li></ul></div>' +
    '<div><h3>Roadmap</h3><ul><li><b>Next:</b> shareable read-only link for the client host</li><li><b>Then:</b> push-style cue alerts to staff phones</li><li><b>Later:</b> post-event retro report auto-built from the issue log</li></ul></div>' +
    '<div class="cs-full"><h3>What building it taught me</h3><p>The readiness ring is the whole product in miniature: a number nobody can argue with, derived from a checklist nobody can quietly skip. Every feature here exists because of a real failure mode — the unconfirmed staffer, the vendor with no arrival time, the small problem (like a photo booth running out of printer paper) that only becomes an emergency because nobody wrote it down. Scope discipline was the hardest PM call: the demo event above is fictional, but the workflow is the one I ran for real events of 200+ guests.</p></div>' +
  "</div>";
}

    '<div class="field-row">'+fieldHtml("fIOwner","Owner","")+fieldHtml("fISev","Severity","Medium",{type:"select",options:["Low","Medium","High"]})+"</div>",
    "Log issue",
    function(){ var t=val("fITitle"); if(!t){ closeModal(); return; }
      ev.issues.push({id:uid("is"), title:t, detail:val("fIDetail"), owner:val("fIOwner")||"Unassigned", severity:val("fISev"), status:"Open"});
      save(); closeModal(); render(); toast("Issue logged."); });
}

/* ================= INIT ================= */
load();
render();
</script>
</body>
</html>
